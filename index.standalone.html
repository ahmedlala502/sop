<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TryGC Operations Knowledge Base v3.0</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        arabic: ['Noto Kufi Arabic', 'sans-serif'],
                    },
                    colors: {
                        trygc: {
                            purple: '#52358C',
                            deep: '#4A3573',
                            orange: '#E8630C',
                            lavender: '#A798BF',
                            peach: '#E3A579',
                            offwhite: '#F6F2F0',
                            bg: '#100B1C',
                            card: '#1D1331',
                            border: '#2D1D4D',
                            surface: '#150F24'
                        },
                        status: {
                            success: '#39D98A',
                            warning: '#E8630C',
                            danger: '#FF5C7A',
                            info: '#52358C'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Styles */
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        
        /* Language Control */
        body.lang-en .ar-text { display: none !important; }
        body.lang-ar .en-text { display: none !important; }
        body.lang-ar { direction: rtl; font-family: 'Noto Kufi Arabic', sans-serif; }
        body.lang-both .ar-text { 
            display: block; 
            direction: rtl; 
            text-align: right; 
            color: #A798BF; 
            font-family: 'Noto Kufi Arabic', sans-serif;
            font-size: 0.9em;
            margin-top: 0.25rem;
            line-height: 1.8;
            border-top: 1px dashed #2D1D4D;
            padding-top: 0.25rem;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #100B1C; }
        ::-webkit-scrollbar-thumb { background: #4A3573; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #E8630C; }

        /* Utilities */
        .glass-panel { background: rgba(29, 19, 49, 0.7); backdrop-filter: blur(10px); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Code Block */
        .code-block { font-family: 'Courier New', monospace; white-space: pre-wrap; }
        
        /* Variable Highlighting */
        .variable-highlight { color: #A78BFA; font-weight: 600; }

        /* Mobile Sidebar Animation */
        #sidebar {
            transition: transform 0.3s ease-in-out;
        }

        /* Prevent body scroll when mobile menu is open */
        body.mobile-menu-open {
            overflow: hidden;
        }

        /* Better touch targets for mobile */
        @media (max-width: 768px) {
            button, a {
                min-height: 44px;
                min-width: 44px;
            }
        }

        /* Responsive table wrapper */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Workflow diagram mobile */
        .workflow-mobile {
            min-width: 600px;
        }
    </style>
</head>
<body class="bg-trygc-bg text-trygc-offwhite h-screen flex overflow-hidden lang-both transition-colors duration-300">

    <!-- SIDEBAR Navigation -->
    <aside id="sidebar" class="w-72 bg-trygc-surface border-r border-trygc-border flex flex-col transition-all duration-300 transform fixed md:relative z-30 h-full md:translate-x-0 -translate-x-full">
        <!-- Brand -->
        <div class="h-16 flex items-center px-4 sm:px-6 border-b border-trygc-border bg-trygc-bg/50 backdrop-blur-md">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-trygc-purple to-trygc-orange flex items-center justify-center text-white font-bold mr-3 shadow-lg shadow-trygc-purple/30">GC</div>
            <div>
                <h1 class="font-bold text-sm tracking-wide text-white">TRYGC OPS</h1>
                <span class="text-[10px] text-trygc-lavender uppercase tracking-widest">Knowledge Base v3.0</span>
            </div>
        </div>

        <!-- Nav Links -->
        <nav id="nav-container" class="flex-1 overflow-y-auto py-4 px-3 space-y-1"></nav>

        <!-- User Profile -->
        <div class="p-4 border-t border-trygc-border">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-trygc-deep flex items-center justify-center text-xs font-bold border border-trygc-lavender/30">OP</div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-medium text-white truncate">Ops Lead</p>
                    <p class="text-[10px] text-trygc-lavender truncate">Grand Community</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col h-full relative min-w-0">
        <!-- Top Bar -->
        <header class="h-16 border-b border-trygc-border bg-trygc-bg/80 backdrop-blur-md flex items-center justify-between px-4 sm:px-6 z-20 sticky top-0">
            <div class="flex items-center gap-2 sm:gap-4 flex-1 min-w-0">
                <button onclick="toggleSidebar()" class="md:hidden text-trygc-lavender hover:text-white p-2 -ml-2">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <!-- Search Bar - Hidden on small mobile -->
                <div class="relative hidden sm:block flex-1 max-w-96 group">
                    <span class="material-symbols-outlined absolute left-3 top-2 text-trygc-lavender group-focus-within:text-trygc-orange transition-colors text-sm">search</span>
                    <input type="text" placeholder="Search SOPs, Templates..." class="w-full bg-trygc-surface border border-trygc-border rounded-lg pl-9 pr-4 py-1.5 text-sm text-trygc-offwhite focus:outline-none focus:border-trygc-orange transition-all placeholder-trygc-lavender/50">
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Language Toggle -->
                <div class="flex bg-trygc-surface border border-trygc-border rounded-lg p-0.5">
                    <button onclick="setLang('en')" class="lang-btn px-2 sm:px-3 py-1 rounded-md text-[10px] font-bold transition-all" data-lang="en">EN</button>
                    <button onclick="setLang('both')" class="lang-btn px-2 sm:px-3 py-1 rounded-md text-[10px] font-bold transition-all bg-trygc-purple text-white shadow" data-lang="both">BOTH</button>
                    <button onclick="setLang('ar')" class="lang-btn px-2 sm:px-3 py-1 rounded-md text-[10px] font-bold transition-all" data-lang="ar">AR</button>
                </div>
                
                <div class="h-4 w-px bg-trygc-border mx-1 hidden sm:block"></div>

                <!-- Export Button -->
                <button onclick="exportHTML()" class="flex items-center gap-2 px-2 sm:px-3 py-1.5 bg-trygc-orange hover:bg-orange-600 text-white rounded-lg text-xs font-bold transition-colors shadow-lg shadow-orange-900/20">
                    <span class="material-symbols-outlined text-[16px]">download</span>
                    <span class="hidden sm:inline">Export</span>
                </button>
            </div>
        </header>

        <!-- Page Viewer -->
        <main id="page-content" class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 scroll-smooth relative"></main>
    </div>

    <!-- Mobile Overlay -->
    <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20 hidden md:hidden"></div>

    <script>
        // --- APP CONFIGURATION ---
        const config = {
            nav: [
                { id: 'cover', icon: 'home_app_logo', labelEn: 'System Overview', labelAr: 'نظرة عامة' },
                { id: 'ia', icon: 'schema', labelEn: 'Navigation & IA', labelAr: 'هيكلة التنقل' },
                
                { type: 'header', labelEn: 'TEAM SOPs', labelAr: 'إجراءات الفرق' },
                { id: 'sop_community', icon: 'groups', labelEn: 'Community', labelAr: 'الكوميونيتي' },
                { id: 'sop_coordination', icon: 'hub', labelEn: 'Coordination', labelAr: 'التنسيق' },
                { id: 'sop_chat', icon: 'chat', labelEn: 'Chat/WhatsApp', labelAr: 'الشات' },
                { id: 'sop_followup', icon: 'schedule', labelEn: 'Follow-Up', labelAr: 'المتابعة' },
                { id: 'sop_coverage', icon: 'visibility', labelEn: 'Coverage & QA', labelAr: 'التغطية' },

                { type: 'header', labelEn: 'OPERATIONS', labelAr: 'العمليات' },
                { id: 'workflows', icon: 'account_tree', labelEn: 'Workflow Maps', labelAr: 'خرائط العمل' },
                { id: 'raci', icon: 'table_view', labelEn: 'RACI Matrix', labelAr: 'مصفوفة RACI' },
                { id: 'gsheets', icon: 'grid_on', labelEn: 'Sheets Blueprint', labelAr: 'هيكلة الشيتات' },
                { id: 'templates', icon: 'content_copy', labelEn: 'Templates Library', labelAr: 'مكتبة القوالب' },
                { id: 'kpis', icon: 'monitoring', labelEn: 'KPIs & SLAs', labelAr: 'المؤشرات' },
                { id: 'components', icon: 'widgets', labelEn: 'Design System', labelAr: 'نظام التصميم' },
            ]
        };

        let currentState = {
            tab: 'cover',
            lang: 'both'
        };

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            loadPage(currentState.tab);
        });

        // --- CORE FUNCTIONS ---
        function setLang(mode) {
            currentState.lang = mode;
            document.body.className = document.body.className.replace(/lang-\w+/, `lang-${mode}`);
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                if(btn.dataset.lang === mode) {
                    btn.classList.add('bg-trygc-purple', 'text-white', 'shadow');
                    btn.classList.remove('text-trygc-lavender');
                } else {
                    btn.classList.remove('bg-trygc-purple', 'text-white', 'shadow');
                    btn.classList.add('text-trygc-lavender');
                }
            });

            if (mode === 'ar') {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            const isClosed = sb.classList.contains('-translate-x-full');
            
            if(isClosed) {
                sb.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.classList.add('mobile-menu-open');
            } else {
                sb.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.classList.remove('mobile-menu-open');
            }
        }

        function renderSidebar() {
            const container = document.getElementById('nav-container');
            container.innerHTML = config.nav.map(item => {
                if(item.type === 'header') {
                    return `
                        <div class="px-4 mt-6 mb-2">
                            <h3 class="text-[10px] font-bold text-trygc-lavender/50 uppercase tracking-widest flex flex-col">
                                <span class="en-text">${item.labelEn}</span>
                                <span class="ar-text text-right" style="font-size: 9px; margin-top: 2px;">${item.labelAr}</span>
                            </h3>
                        </div>
                    `;
                }
                const active = currentState.tab === item.id;
                return `
                    <button onclick="loadPage('${item.id}')" 
                        class="w-full text-left flex items-start gap-3 px-3 py-2 rounded-lg transition-all group relative ${active ? 'bg-trygc-card text-white border border-trygc-border shadow-sm' : 'text-trygc-lavender hover:bg-trygc-card/50 hover:text-white'}">
                        ${active ? '<div class="absolute left-0 top-2 bottom-2 w-1 bg-trygc-orange rounded-r"></div>' : ''}
                        <span class="material-symbols-outlined text-[20px] ${active ? 'text-trygc-orange' : 'group-hover:text-trygc-peach'}">${item.icon}</span>
                        <div class="flex-1">
                            <span class="en-text block text-sm font-medium">${item.labelEn}</span>
                            <span class="ar-text block text-xs opacity-80 mt-0.5 font-medium">${item.labelAr}</span>
                        </div>
                    </button>
                `;
            }).join('');
        }

        function loadPage(id) {
            currentState.tab = id;
            renderSidebar();
            if(window.innerWidth < 768) toggleSidebar();

            const viewer = document.getElementById('page-content');
            viewer.innerHTML = '<div class="flex h-96 items-center justify-center text-trygc-orange animate-pulse"><span class="material-symbols-outlined text-4xl">hourglass_empty</span></div>';

            setTimeout(() => {
                let html = '';
                try {
                    switch(id) {
                        case 'cover': html = renderCover(); break;
                        case 'ia': html = renderIA(); break;
                        case 'workflows': html = renderWorkflows(); break;
                        case 'raci': html = renderRACI(); break;
                        case 'gsheets': html = renderGSheets(); break;
                        case 'templates': html = renderTemplates(); break;
                        case 'kpis': html = renderKPIs(); break;
                        case 'components': html = renderComponents(); break;
                        default: 
                            if(id.startsWith('sop_')) html = renderSOP(id);
                            else html = renderCover();
                    }
                    viewer.innerHTML = `<div class="fade-in max-w-6xl mx-auto pb-20">${html}</div>`;
                } catch(e) {
                    viewer.innerHTML = `<div class="p-8 text-status-danger">Error: ${e.message}</div>`;
                }
            }, 100);
        }

        function exportHTML() {
            const docClone = document.documentElement.outerHTML;
            const blob = new Blob([docClone], {type: 'text/html'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `TryGC_Ops_KB_${new Date().toISOString().slice(0,10)}.html`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- CONTENT RENDERERS ---

        function renderCover() {
            return `
                <div class="text-center py-8 sm:py-16">
                    <div class="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-tr from-trygc-purple to-trygc-orange rounded-3xl mx-auto flex items-center justify-center text-4xl sm:text-5xl font-bold text-white mb-6 sm:mb-8 shadow-2xl shadow-trygc-orange/20 ring-4 ring-trygc-bg ring-offset-2 ring-offset-trygc-border">GC</div>
                    
                    <h1 class="text-3xl sm:text-4xl md:text-6xl font-extrabold mb-4 sm:mb-6 tracking-tight text-white px-4">
                        <span class="en-text">TryGC Operations Knowledge Base</span>
                        <span class="ar-text block text-trygc-peach mt-2 font-arabic text-2xl sm:text-3xl md:text-5xl">قاعدة معرفة العمليات</span>
                    </h1>
                    
                    <p class="text-base sm:text-lg text-trygc-lavender mb-8 sm:mb-12 max-w-2xl mx-auto leading-relaxed px-4">
                        <span class="en-text">The single source of truth for Grand Community operations. SOPs, workflows, RACI, templates, KPIs, and troubleshooting — all in one place.</span>
                        <span class="ar-text">المصدر الوحيد للحقيقة لعمليات جراند كوميونيتي. الإجراءات، خرائط العمل، RACI، القوالب، المؤشرات — كل شيء في مكان واحد.</span>
                    </p>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6 text-left mb-8 sm:mb-12 px-4">
                        ${[
                            { page: 'sop_community', icon: 'groups', titleEn: 'Team SOPs', titleAr: 'إجراءات الفرق', descEn: 'Step-by-step operational procedures for each team', descAr: 'إجراءات تشغيلية خطوة بخطوة لكل فريق' },
                            { page: 'raci', icon: 'table_view', titleEn: 'RACI Matrix', titleAr: 'مصفوفة RACI', descEn: 'Clear ownership: Responsible, Accountable, Consulted, Informed', descAr: 'ملكية واضحة: المسؤول، المسائل، المستشار، المُبلّغ' },
                            { page: 'templates', icon: 'content_copy', titleEn: 'Templates', titleAr: 'القوالب', descEn: 'Ready-to-send bilingual message templates', descAr: 'قوالب رسائل ثنائية اللغة جاهزة للإرسال' }
                        ].map(card => `
                            <div onclick="loadPage('${card.page}')" class="group p-4 sm:p-6 bg-trygc-card border border-trygc-border rounded-xl hover:border-trygc-orange cursor-pointer transition-all hover:-translate-y-1 relative overflow-hidden">
                                <div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity"><span class="material-symbols-outlined text-6xl sm:text-8xl">${card.icon}</span></div>
                                <h3 class="font-bold text-base sm:text-lg mb-2 text-white group-hover:text-trygc-orange transition-colors">
                                    <span class="en-text">${card.titleEn}</span>
                                    <span class="ar-text">${card.titleAr}</span>
                                </h3>
                                <p class="text-xs sm:text-sm text-trygc-lavender">
                                    <span class="en-text">${card.descEn}</span>
                                    <span class="ar-text">${card.descAr}</span>
                                </p>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Non-Negotiables -->
                    <div class="bg-trygc-card border border-trygc-orange/30 rounded-xl p-4 sm:p-6 text-left max-w-4xl mx-auto">
                        <h2 class="text-lg sm:text-xl font-bold text-trygc-orange mb-4 flex items-center gap-2">
                            <span class="material-symbols-outlined">shield</span>
                            <span class="en-text">Non-Negotiable Principles</span>
                            <span class="ar-text">مبادئ غير قابلة للتفاوض</span>
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 text-sm">
                            ${[
                                { en: 'Single source of truth: System + Sheet + Folder must always match', ar: 'مصدر حقيقة واحد: النظام + الشيت + الفولدر يجب أن يتطابقوا دائماً' },
                                { en: 'Zero verbal exceptions: all changes must be documented', ar: 'صفر استثناءات شفهية: كل التغييرات يجب توثيقها' },
                                { en: 'Done = fully compliant with the client brief', ar: 'تم = مطابق للبرِيف بالكامل' },
                                { en: 'Escalate early: risks must be flagged within 2 hours', ar: 'تصعيد مبكر: المخاطر يجب الإبلاغ عنها خلال ساعتين' }
                            ].map(rule => `
                                <div class="flex items-start gap-2 p-3 bg-trygc-bg rounded">
                                    <span class="text-status-success mt-0.5">●</span>
                                    <div class="text-xs sm:text-sm">
                                        <span class="en-text block text-trygc-offwhite">${rule.en}</span>
                                        <span class="ar-text block text-trygc-lavender">${rule.ar}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderIA() {
            return `
                <h1 class="text-2xl sm:text-3xl font-bold text-white mb-6 sm:mb-8">
                    <span class="en-text">Information Architecture</span>
                    <span class="ar-text">هيكلة المعلومات</span>
                </h1>
                <div class="prose prose-invert max-w-none">
                    <p class="text-trygc-lavender mb-6 text-sm sm:text-base">
                        <span class="en-text">The Knowledge Base is organized into logical sections for easy navigation and daily operational use.</span>
                        <span class="ar-text">قاعدة المعرفة منظمة في أقسام منطقية لسهولة التنقل والاستخدام التشغيلي اليومي.</span>
                    </p>
                    
                    <div class="space-y-3 sm:space-y-4">
                        ${config.nav.filter(n => !n.type).map(item => `
                            <div class="bg-trygc-card border border-trygc-border rounded-lg p-3 sm:p-4 hover:border-trygc-orange transition-colors cursor-pointer" onclick="loadPage('${item.id}')">
                                <div class="flex items-center gap-3">
                                    <span class="material-symbols-outlined text-trygc-orange text-xl sm:text-2xl">${item.icon}</span>
                                    <div>
                                        <div class="font-bold text-white text-sm sm:text-base">
                                            <span class="en-text">${item.labelEn}</span>
                                            <span class="ar-text">${item.labelAr}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderRACI() {
            const raciData = [
                { task: 'Booking Order Creation', taskAr: 'إنشاء أمر الحجز', c: 'R', co: 'C', ch: 'I', f: '-', cv: '-', l: 'A' },
                { task: 'Campaign Folder Setup', taskAr: 'تجهيز فولدرات الحملة', c: 'C', co: 'R/A', ch: 'I', f: '-', cv: '-', l: 'I' },
                { task: 'Influencer List Selection', taskAr: 'اختيار قائمة المؤثرين', c: 'R', co: 'C', ch: '-', f: '-', cv: '-', l: 'A' },
                { task: 'Sending Invitations', taskAr: 'إرسال الدعوات', c: 'I', co: 'C', ch: 'R', f: 'C', cv: '-', l: 'I' },
                { task: 'Morning Reminders (Today)', taskAr: 'تذكيرات الصباح (اليوم)', c: '-', co: 'I', ch: 'C', f: 'R/A', cv: '-', l: '-' },
                { task: 'Brief Sending (24h before)', taskAr: 'إرسال البريف (قبل 24 ساعة)', c: '-', co: 'C', ch: 'R', f: 'C', cv: '-', l: 'I' },
                { task: 'Coverage QA & Upload', taskAr: 'فحص التغطية والرفع', c: '-', co: 'I', ch: '-', f: 'C', cv: 'R/A', l: 'I' },
                { task: 'Missing/Need Resolution', taskAr: 'حل النواقص والتعديل', c: 'C', co: 'I', ch: 'C', f: 'R', cv: 'C', l: 'A' },
                { task: 'pCloud Archiving', taskAr: 'أرشفة pCloud', c: '-', co: 'I', ch: '-', f: '-', cv: 'R/A', l: 'I' },
                { task: 'Final Report Delivery', taskAr: 'تسليم التقرير النهائي', c: 'C', co: 'R', ch: '-', f: '-', cv: 'C', l: 'A' },
                { task: 'System Reconciliation', taskAr: 'مطابقة النظام', c: 'C', co: 'R', ch: '-', f: '-', cv: 'C', l: 'A' }
            ];

            return `
                <div class="mb-6 sm:mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <h1 class="text-2xl sm:text-3xl font-bold text-white">
                        <span class="en-text">RACI Matrix</span>
                        <span class="ar-text">مصفوفة RACI</span>
                    </h1>
                    <div class="text-xs text-trygc-lavender flex flex-wrap gap-2 sm:gap-3">
                        <span class="flex items-center gap-1"><b class="text-trygc-orange">R</b> Responsible</span>
                        <span class="flex items-center gap-1"><b class="text-trygc-purple">A</b> Accountable</span>

        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const icon = button.querySelector('.material-symbols-outlined');
                const originalText = icon.textContent;
                icon.textContent = 'check';
                icon.style.color = '#39D98A';
                setTimeout(() => {
                    icon.textContent = originalText;
                    icon.style.color = '';
                }, 2000);
            });
        }
